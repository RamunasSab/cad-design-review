name: Tests

on:
  push:
  pull_request:

env:
  PYTHONUTF8: "1"

jobs:
  matrix:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ["3.10", "3.11", "3.12", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
      - name: Compile Python files
        run: python -m compileall -q scripts tests
      - name: Run smoke tests
        run: python tests/test_smoke.py
      - name: Run reliability and documentation contracts
        run: python -m unittest discover -s tests -p "test_reliability.py"
      - name: Verify ISO 286-1 calculations
        run: python -m unittest discover -s tests -p "test_iso286.py"
      - name: Verify shared browser ISO engine
        run: node tests/test_iso286_web.js
      - name: Validate reference JSON files
        run: python -c "import json, pathlib; [json.loads(p.read_text(encoding='utf-8')) for p in pathlib.Path('references').glob('*.json')]"

  test:
    name: test
    needs: matrix
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Require every platform and Python version
        env:
          MATRIX_RESULT: ${{ needs.matrix.result }}
        run: test "$MATRIX_RESULT" = "success"

